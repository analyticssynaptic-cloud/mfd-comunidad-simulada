<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Mapa 3D - comunidad simulada MFD</title>
<style>
html,body{margin:0;height:100%;background:#0b0709;color:#f5f0ee;font-family:Arial,sans-serif;overflow:hidden}
#top{position:fixed;top:12px;left:12px;z-index:2;background:rgba(20,12,15,.85);padding:10px 14px;border:1px solid #3a1d20;border-radius:10px;max-width:330px}
#top h1{font-size:15px;color:#dc2626;margin:0 0 4px}
#top p{font-size:12px;color:#aaa;margin:2px 0}
button{background:#241b1e;color:#f5f0ee;border:1px solid #4a262a;border-radius:6px;padding:5px 9px;margin:3px 3px 0 0;cursor:pointer;font-size:12px}
button.on{background:#dc2626;border-color:#dc2626}
#card{position:fixed;right:12px;top:12px;width:340px;max-height:92vh;overflow:auto;z-index:2;background:rgba(20,12,15,.94);border:1px solid #3a1d20;border-radius:10px;padding:12px;display:none;font-size:13px;line-height:1.4}
#card h2{font-size:16px;margin:0 0 6px;color:#dc2626}
#card .tag{display:inline-block;font-size:11px;background:#2a1d20;border-radius:4px;padding:2px 6px;margin:2px 3px 2px 0}
#card .msg{background:#3b1316;border-radius:8px;padding:8px;margin-top:8px}
#lab{position:fixed;z-index:1;pointer-events:none;color:#f5f0ee;font-size:12px;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:4px;transform:translate(-50%,-50%)}
#leyenda{position:fixed;bottom:12px;left:12px;z-index:2;font-size:12px;background:rgba(20,12,15,.85);padding:8px 12px;border-radius:8px;border:1px solid #3a1d20}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
#aviso{position:fixed;bottom:12px;right:12px;z-index:2;font-size:11px;color:#888;background:rgba(20,12,15,.85);padding:6px 10px;border-radius:6px}
</style></head><body>
<div id="top">
  <h1>Comunidad simulada MFD · 3D</h1>
  <p>10.000 personas en el mapa. Color = postura. Altura = estrato. Clic en una persona para ver su ficha y su opinión.</p>
  <div>
    <button data-f="todas" class="on">Todas</button>
    <button data-f="atrae">Atrae</button>
    <button data-f="indiferente">Indiferente</button>
    <button data-f="no llega">No llega</button>
  </div>
  <div>
    <button id="btnDebate">Resaltar debate (25)</button>
    <button id="btnReset">Vista inicial</button>
  </div>
  <p id="stats"></p>
</div>
<div id="card"></div>
<div id="leyenda">
  <span class="dot" style="background:#22c55e"></span>Le llama la atención &nbsp;
  <span class="dot" style="background:#eab308"></span>Indiferente &nbsp;
  <span class="dot" style="background:#ef4444"></span>No le llega
</div>
<div id="aviso">SIMULACIÓN · perfiles sintéticos</div>
<script src="datos.js"></script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const COLOR = { 'le llama la atención': 0x22c55e, 'le es indiferente': 0xeab308, 'no le llega': 0xef4444 };
const CLASE = { 'le llama la atención': 'atrae', 'le es indiferente': 'indiferente', 'no le llega': 'no llega' };
const PIEL = [0xf1c7a5, 0xd9a57c, 0xb47c52, 0x8d5a3b, 0x5e3b26];
const CIU = Object.fromEntries(Object.entries(window.CENTROS));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0709);
scene.fog = new THREE.Fog(0x0b0709, 120, 260);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 70, 95);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xffffff, 0x332020, 1.1));
const sol = new THREE.DirectionalLight(0xffffff, 0.8);
sol.position.set(30, 80, 40);
scene.add(sol);

const suelo = new THREE.Mesh(new THREE.CircleGeometry(170, 64), new THREE.MeshStandardMaterial({ color: 0x14090c }));
suelo.rotation.x = -Math.PI / 2;
scene.add(suelo);
const grid = new THREE.GridHelper(340, 68, 0x3a1d20, 0x231418);
grid.position.y = 0.01;
scene.add(grid);

const N = window.PERSONAS.length;
const cuerpoGeo = new THREE.CapsuleGeometry(0.55, 1.3, 4, 10);
const cabezaGeo = new THREE.SphereGeometry(0.42, 12, 10);
const cuerpoMat = new THREE.MeshStandardMaterial({ roughness: 0.6 });
const cabezaMat = new THREE.MeshStandardMaterial({ roughness: 0.5 });
const cuerpos = new THREE.InstancedMesh(cuerpoGeo, cuerpoMat, N);
const cabezas = new THREE.InstancedMesh(cabezaGeo, cabezaMat, N);
const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
const colorTmp = new THREE.Color();
const alturas = [];

window.PERSONAS.forEach((r, i) => {
  const [id, nombre, genero, edad, ciudad, estrato, ocupacion, pers, acceso, gustos, postura, cal, x, z] = r;
  const h = 0.9 + estrato * 0.12;
  alturas.push(h);
  p.set(x, h * 1.2, z);
  s.set(1, h, 1);
  m.compose(p, q, s);
  cuerpos.setMatrixAt(i, m);
  colorTmp.setHex(COLOR[postura]);
  cuerpos.setColorAt(i, colorTmp);
  p.set(x, h * 2.4 + 0.3, z);
  s.set(1, 1, 1);
  m.compose(p, q, s);
  cabezas.setMatrixAt(i, m);
  colorTmp.setHex(PIEL[[...id].reduce((a, c) => a + c.charCodeAt(0), 0) % PIEL.length]);
  cabezas.setColorAt(i, colorTmp);
});
cuerpos.instanceMatrix.needsUpdate = true;
cabezas.instanceMatrix.needsUpdate = true;
cuerpos.instanceColor.needsUpdate = true;
cabezas.instanceColor.needsUpdate = true;
scene.add(cuerpos, cabezas);

const etiquetas = [];
for (const [ciudad, [cx, cz]] of Object.entries(CIU)) {
  const el = document.createElement('div');
  el.id = 'lab';
  el.textContent = ciudad;
  document.body.appendChild(el);
  etiquetas.push({ el, v: new THREE.Vector3(cx, 0.5, cz) });
}

const stats = document.getElementById('stats');
const cuenta = { atrae: 0, indiferente: 0, 'no llega': 0 };
window.PERSONAS.forEach(r => cuenta[CLASE[r[10]]]++);
stats.textContent = `Atrae ${cuenta.atrae} · Indiferente ${cuenta.indiferente} · No llega ${cuenta['no llega']}`;

let filtro = 'todas';
const oculto = new THREE.Matrix4().makeScale(0, 0, 0);
function aplicarFiltro() {
  window.PERSONAS.forEach((r, i) => {
    const visible = filtro === 'todas' || CLASE[r[10]] === filtro;
    const base = new THREE.Matrix4();
    cuerpos.getMatrixAt(i, base);
    if (!visible) {
      cuerpos.setMatrixAt(i, oculto); cabezas.setMatrixAt(i, oculto);
    } else {
      cuerpos.setMatrixAt(i, origen[i].cuerpo); cabezas.setMatrixAt(i, origen[i].cabeza);
    }
  });
  cuerpos.instanceMatrix.needsUpdate = true;
  cabezas.instanceMatrix.needsUpdate = true;
}
const origen = [];
window.PERSONAS.forEach((r, i) => {
  const a = new THREE.Matrix4(), b = new THREE.Matrix4();
  cuerpos.getMatrixAt(i, a); cabezas.getMatrixAt(i, b);
  origen.push({ cuerpo: a, cabeza: b });
});
document.querySelectorAll('button[data-f]').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('button[data-f]').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  filtro = btn.dataset.f;
  aplicarFiltro();
});

const debateIds = new Map();
window.DEBATE.forEach(([id, ronda, texto, postura]) => {
  if (!debateIds.has(id)) debateIds.set(id, []);
  debateIds.get(id).push({ ronda, texto });
});
let resaltado = false;
const halo = new THREE.Group();
scene.add(halo);
document.getElementById('btnDebate').onclick = () => {
  resaltado = !resaltado;
  halo.clear();
  if (resaltado) {
    window.PERSONAS.forEach((r, i) => {
      if (!debateIds.has(r[0])) return;
      const [x, z] = [r[12], r[13]];
      const h = alturas[i];
      const anillo = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.2, 24),
        new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
      anillo.rotation.x = -Math.PI / 2;
      anillo.position.set(x, 0.05, z);
      halo.add(anillo);
    });
  }
  document.getElementById('btnDebate').classList.toggle('on', resaltado);
};
document.getElementById('btnReset').onclick = () => {
  camera.position.set(0, 70, 95);
  controls.target.set(0, 0, 0);
};

const card = document.getElementById('card');
const ray = new THREE.Raycaster();
const ratón = new THREE.Vector2();
let hoverIdx = -1;
renderer.domElement.addEventListener('pointermove', e => {
  ratón.x = (e.clientX / innerWidth) * 2 - 1;
  ratón.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ratón, camera);
  const hit = ray.intersectObject(cuerpos);
  hoverIdx = hit.length && hit[0].instanceId !== undefined ? hit[0].instanceId : -1;
  renderer.domElement.style.cursor = hoverIdx >= 0 ? 'pointer' : 'default';
});
renderer.domElement.addEventListener('click', () => {
  if (hoverIdx < 0) return;
  const r = window.PERSONAS[hoverIdx];
  const [id, nombre, genero, edad, ciudad, estrato, ocupacion, pers, acceso, gustos, postura, cal, x, z, opinion] = r;
  const d = debateIds.get(id) || [];
  const msgs = d.map(m => `<div class="msg"><b>Ronda ${m.ronda}</b><br>${m.texto}</div>`).join('');
  card.innerHTML = `
    <h2>${nombre}</h2>
    <span class="tag">${id}</span><span class="tag">${edad} años · ${genero === 'F' ? 'mujer' : 'hombre'}</span>
    <span class="tag">${ciudad}</span><span class="tag">estrato ${estrato}</span>
    <span class="tag">${ocupacion}</span><span class="tag">acceso ${acceso}</span>
    <span class="tag">${pers}</span>
    <p><b>Gustos:</b> ${gustos}</p>
    <p><b>Postura:</b> ${CLASE[postura]} · <b>Calificación:</b> ${cal}/5</p>
    <p><b>Opinión:</b> ${opinion}</p>
    ${msgs ? '<p><b>En el debate:</b></p>' + msgs : ''}
    <p style="color:#888;font-size:11px">Perfil sintético.</p>`;
  card.style.display = 'block';
});

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

const v = new THREE.Vector3();
function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
  etiquetas.forEach(({ el, v: pos }) => {
    v.copy(pos).project(camera);
    el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px';
    el.style.top = ((-v.y + 1) / 2 * innerHeight) + 'px';
    el.style.display = v.z < 1 ? 'block' : 'none';
  });
}
loop();
</script></body></html>
